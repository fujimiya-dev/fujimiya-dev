name: Update README cards

on:
  schedule:
    - cron: "17 0 * * *" # once a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=fujimiya-dev&custom_title=Fujimiya%27s%20GitHub%20Stats&show_icons=true&hide_border=true&border_radius=12&bg_color=eef5ff&title_color=3b6fb6&text_color=3d4a5c&icon_color=6c9bd2&ring_color=6c9bd2
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=fujimiya-dev&layout=compact&langs_count=6&hide_border=true&border_radius=12&bg_color=eef5ff&title_color=3b6fb6&text_color=3d4a5c
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
